proxies: []
proxy-groups:
- interval: 300
  name: auto
  servers: []
  tolerance: 50
  type: url-test
  url: http://cp.cloudflare.com/generate_100k
- name: manual
  servers:
  - auto
  type: select
rules:
- payload: 127.0.0.0/8
  proxy: DIRECT
  type: ip-cidr
- payload: 10.0.0.0/8
  proxy: DIRECT
  type: ip-cidr
- payload: 172.16.0.0/12
  proxy: DIRECT
  type: ip-cidr
- payload: 192.168.0.0/16
  proxy: DIRECT
  type: ip-cidr
- payload: '*.google.com'
  proxy: auto
  type: domain
