name: free-nodes
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pyyaml
      - run: python3 bot.py
      - run: |
          git config user.name "free-node-bot"
          git config user.email "bot@freenodes"
          git add sub_a.txt sub_b.txt sub_a.yaml sub_b.yaml summary.txt
          git commit -m "$(date +%F)" || exit 0
          git push
